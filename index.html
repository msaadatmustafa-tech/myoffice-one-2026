.paper{font-family:Calibri,'Aptos','Segoe UI',Arial,sans-serif}

.sidefoot{line-height:1.75}.btn:focus-visible,.smallbtn:focus-visible{outline:2px solid #2779c7;outline-offset:2px}

<script>
'use strict';
const $=sel=>document.querySelector(sel),$$=sel=>[...document.querySelectorAll(sel)];
const enc=new TextEncoder(),dec=new TextDecoder();
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const xesc=s=>esc(s).replaceAll("'",'&apos;');
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const key='myoffice-studio-v1';
let data={items:[],active:null,mode:'home'},picked=null,selection='A1',currentSlide=0,presentAt=-1,sheetIndex=0,saveTimer=null,activeEditor=null;
try{let d=JSON.parse(localStorage.getItem(key)||'null');if(d&&Array.isArray(d.items)){data=d;data.mode='home';}}catch(e){}
function store(){try{localStorage.setItem(key,JSON.stringify(data));}catch(e){toast('Storage full. Export a backup now to avoid losing changes.');}}
function touch(item){item.updated=new Date().toISOString();store();}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3400);}
function getItem(){return data.items.find(i=>i.id===data.active)||null;}
function title(){const item=getItem();$('#pageTitle').innerHTML=esc(item?item.name:data.mode==='home'?'MyOffice One 2026':({writer:'Documents',sheets:'Spreadsheets',slides:'Presentations'}[data.mode]))+`<span class="dim">${item?'Draft cached locally • Save to disk • '+{writer:'Document',sheets:'Spreadsheet',slides:'Presentation'}[item.type]:'Your private workspace'}</span>`;$('#saveBtn').disabled=!item;$('#exportBtn').disabled=!item;}
function nav(mode){data.mode=mode;let item=getItem();if(mode!=='home'&&(!item||item.type!==mode)){let found=data.items.find(i=>i.type===mode);data.active=found?.id||null;}$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===mode));render();}
function newItem(type){const stamp=new Date().toISOString();let item={id:uid(),type,name:({writer:'Untitled Document',sheets:'Untitled Workbook',slides:'Untitled Presentation'})[type],created:stamp,updated:stamp};if(type==='writer')item.html='<h1>Untitled Document</h1><p>Start writing here...</p>';if(type==='sheets')item.sheets=[{name:'Sheet1',cells:{}}];if(type==='slides')item.slides=[{title:'Your Presentation',body:'Click here to edit your subtitle',bg:'#273775',layout:'title'},{title:'Introduction',body:'• First key point\n• Second key point\n• Third key point',bg:'#404ea2',layout:'content'}];data.items.unshift(item);data.active=item.id;data.mode=type;sheetIndex=0;currentSlide=0;store();$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===type));render();toast('Created. Draft cached. Press Ctrl+S to save a real file to your PC.');}
function openItem(id){let item=data.items.find(i=>i.id===id);if(!item)return;data.active=id;data.mode=item.type;sheetIndex=0;currentSlide=0;$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===item.type));render();}
function render(){title();const w=$('#workspace');if(data.mode==='home'){renderHome(w);return;}let item=getItem();if(!item){w.innerHTML=`<div class="home"><h2>No ${esc(data.mode)} files yet</h2><p class="muted">Create your first file to start working.</p><button class="btn primary" onclick="newItem('${data.mode}')">+ Create New</button></div>`;return;}if(data.mode==='writer')renderWriter(w,item);if(data.mode==='sheets')renderSheets(w,item);if(data.mode==='slides')renderSlides(w,item);}

  if(!Array.isArray(raw.sheets)||!raw.sheets.length||raw.sheets.length>100)throw Error('Invalid backup worksheets');

  item.gridRows=Math.min(500,Math.max(35,Number(raw.gridRows)||35));item.gridCols=Math.min(52,Math.max(18,Number(raw.gridCols)||18));
 }
 if(raw.type==='slides'){
  if(!Array.isArray(raw.slides)||!raw.slides.length||raw.slides.length>1000)throw Error('Invalid backup slides');
  item.slides=raw.slides.map(s=>{if(!s||typeof s!=='object')throw Error('Invalid slide');return {title:String(s.title||''),body:String(s.body||''),bg:/^#[0-9a-f]{6}$/i.test(s.bg)?s.bg:'#273775',layout:['title','content','section'].includes(s.layout)?s.layout:'content'};});
 }
 return item;
}
async function openFile(file){try{if(file.size>75*1024*1024)throw Error('File exceeds 75 MB limit');let ext=file.name.split('.').pop().toLowerCase(),base=file.name.replace(/\.[^.]+$/,'');if(ext==='myoffice'){let doc=JSON.parse(await file.text());if(doc.format!=='myoffice-v1'||!Array.isArray(doc.items))throw Error('Invalid .myoffice backup');const imported=doc.items.map(normalizeBackupItem);for(const item of imported)data.items.unshift(item);let count=imported.length;data.mode='home';data.active=null;store();render();toast('Imported '+count+' file(s) from backup.');return null;}let item={id:uid(),name:base,created:new Date().toISOString(),updated:new Date().toISOString()};if(ext==='docx'){item.type='writer';item.html=await readDocx(await file.arrayBuffer());}else if(['html','htm','txt'].includes(ext)){item.type='writer';item.html=ext==='txt'?'<p>'+esc(await file.text()).replaceAll('\n','<br>')+'</p>':sanitizeHTML(await file.text());}else if(ext==='xlsx'){item.type='sheets';item.sheets=await readXlsx(await file.arrayBuffer());}else if(['csv','tsv'].includes(ext)){item.type='sheets';item.sheets=parseCSV(await file.text());}else if(ext==='pptx'){item.type='slides';item.slides=await readPptx(await file.arrayBuffer());}else throw Error('Unsupported format');data.items.unshift(item);data.active=item.id;data.mode=item.type;$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===item.type));store();render();toast('Imported '+file.name+'. Advanced formatting may not be preserved.');return item;}catch(e){console.error(e);toast('Could not open: '+e.message);return null;}}

// MyOffice One: real Save / Save As. Draft cache is recovery only, never presented as disk save.
const diskHandles=new Map();
const formats={writer:[['Word document','docx'],['MyOffice editable project','myoffice'],['HTML web document (keeps pictures)','html'],['Plain text','txt'],['Print to PDF','pdf']],sheets:[['Excel workbook','xlsx'],['MyOffice editable project','myoffice'],['CSV sheet','csv']],slides:[['PowerPoint slides','pptx'],['MyOffice editable project','myoffice'],['Print to PDF (current slide)','pdf']]};
function mimeFor(ext){return ({docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',myoffice:'application/json',html:'text/html',txt:'text/plain',csv:'text/csv'})[ext]||'application/octet-stream';}
async function makePayload(item,ext){let payload;if(ext==='docx')payload=await makeDocx(item);else if(ext==='xlsx')payload=await makeXlsx(item);else if(ext==='pptx')payload=await makePptx(item);else if(ext==='myoffice')payload=JSON.stringify({format:'myoffice-v1',items:[item]},null,2);else if(ext==='html')payload='<!doctype html><html><head><meta charset="UTF-8"><title>'+esc(item.name)+'</title></head><body>'+sanitizeHTML(item.html)+'</body></html>';else if(ext==='txt')payload=(item.html?new DOMParser().parseFromString(item.html,'text/html').body.textContent:'')||'';else if(ext==='csv')payload=csvExport(sheet(item));else throw Error('Unsupported file type '+ext);return new Blob([payload],{type:mimeFor(ext)});}
async function putFile(item,ext,saveAs=false,newName=null){
 if(ext==='pdf'){window.print();toast('Print dialogue opened. Choose Save as PDF.');return;}
 try{
 const b=await makePayload(item,ext), name=(newName||filename(item,ext)).replace(/[\\/:*?"<>|]/g,'_');
  const old=diskHandles.get(item.id);let handle=old&&!saveAs&&old.ext===ext?old.handle:null;
  if(window.myOfficeDisk && typeof window.myOfficeDisk.saveFile==='function'){
    const array=Array.from(new Uint8Array(await b.arrayBuffer()));const result=await window.myOfficeDisk.saveFile({name,bytes:array,ext,existingPath:handle?.path||null});
    if(!result || result.cancelled)return;
    diskHandles.set(item.id,{handle:{path:result.path},ext});
  }else if(window.showSaveFilePicker){
    try{
      if(!handle){handle=await window.showSaveFilePicker({suggestedName:name,types:[{description:ext.toUpperCase()+' file',accept:{[mimeFor(ext)]:['.'+ext]}}]});}
      const w=await handle.createWritable();await w.write(b);await w.close();diskHandles.set(item.id,{handle,ext});
    }catch(e){if(['SecurityError','NotAllowedError','TypeError'].includes(e?.name)){download(name,mimeFor(ext),b);toast('Direct save restricted. Saved as browser download.');return;}throw e;}
  }else{download(name,mimeFor(ext),b);toast('File downloaded. Check your Downloads folder.');return;}
  item.savedFormat=ext;if(newName)item.name=newName.replace(/\.[^.]+$/,'');touch(item);title();toast('Saved to disk: '+name);
 }catch(e){if(e?.name==='AbortError'){toast('Save cancelled. Your draft is still here.');return;}console.error(e);toast('Disk save failed: '+e.message);}
}
async function saveCurrent(){const item=getItem();if(!item)return;let saved=diskHandles.get(item.id), ext=saved?.ext||item.savedFormat||({writer:'docx',sheets:'xlsx',slides:'pptx'})[item.type];if(saved&&(!saved.imported||saved.ext==='myoffice'))return putFile(item,ext,false);return showSaveAsDialog(ext);}
function showSaveAsDialog(def){const i=getItem();if(!i)return;let fmt=formats[i.type];if(!fmt.some(([_,e])=>e===def))def=fmt[0][1];
 $('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><h3>Save As — ${esc(i.name)}</h3><p>Select a filename and format. Your file is written to your PC using a Windows Save dialog. Drafts are separately cached for recovery.</p><label class="formLabel" for="saveNameInput">Filename</label><input id="saveNameInput" value="${esc(i.name)}" maxlength="128"/><label class="formLabel" for="saveFormatSelect">File type</label><select id="saveFormatSelect" style="display:block;width:100%;padding:12px;border:1px solid #c6cddc;border-radius:8px">${fmt.map(([label,ext])=>`<option value="${ext}" ${ext===def?'selected':''}>${esc(label)} (.${ext})</option>`).join('')}</select><div class="modalactions"><button class="btn" id="saveCancel">Cancel</button><button class="btn primary" id="saveConfirm">💾 Save to PC</button></div></div></div>`;
 $('#saveCancel').onclick=()=>{$('#modalRoot').innerHTML=''};
 $('#saveConfirm').onclick=async()=>{const name=$('#saveNameInput').value.trim();const ext=$('#saveFormatSelect').value;if(!name)return toast('Enter a filename.');$('#modalRoot').innerHTML='';await putFile(i,ext,true,name.replace(/\.(docx|xlsx|pptx|myoffice|html|csv|txt|pdf)$/i,'')+'.'+ext);};
 $('#saveNameInput').focus();$('#saveNameInput').select();
}
async function openWithPicker(){
 try{if(window.myOfficeDisk && typeof window.myOfficeDisk.openFile==='function'){let r=await window.myOfficeDisk.openFile();if(!r)return;await importNativeFile(r);return;}
 if(window.showOpenFilePicker){let [h]=await window.showOpenFilePicker({multiple:false,types:[{description:'Office files',accept:{'application/octet-stream':['.docx','.xlsx','.pptx','.html','.txt','.csv','.tsv','.myoffice']}}]});if(h){let f=await h.getFile();await openFile(f);let i=getItem();if(i&&f.name)diskHandles.set(i.id,{handle:h,ext:f.name.split('.').pop().toLowerCase(),imported:true});}return;}
 $('#fileInput').click();
 }catch(e){if(e?.name!=='AbortError'){console.error(e);if(['SecurityError','TypeError','NotAllowedError'].includes(e?.name)){$('#fileInput').click();return;}toast('Could not open: '+e.message);}}
}

async function importNativeFile(r) {
 if(!r)return;
 if(r.error){toast('Cannot open '+(r.name||'file')+': '+r.error);return;}
 try{
  const bytes=new Uint8Array(r.bytes);
  const imported=await openFile(new File([bytes],r.name));
  if(imported && r.path)diskHandles.set(imported.id,{
   handle:{path:r.path},ext:r.name.split('.').pop().toLowerCase(),imported:true
  });
 }catch(e){console.error(e);toast('Could not load selected file: '+e.message);}
}
let readingNativeFiles=false, readAgain=false;
async function openFilesFromExplorer(){
 if(typeof window.myOfficeDisk?.consumeLaunchFiles!=='function')return;
 if(readingNativeFiles){readAgain=true;return;}
 readingNativeFiles=true;
 try{
  do {
   readAgain=false;
   const files=await window.myOfficeDisk.consumeLaunchFiles();
   for(const f of files||[])await importNativeFile(f);
  }while(readAgain);
 }catch(e){console.error(e);toast('Could not open Windows file: '+e.message);}
 finally{readingNativeFiles=false;}
}
if(typeof window.myOfficeDisk?.onExternalFilesReady==='function'){
 window.myOfficeDisk.onExternalFilesReady(()=>{openFilesFromExplorer();});
}
openFilesFromExplorer();

$$('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));$('#backupBtn').onclick=backupAll;$('#saveBtn').onclick=saveCurrent;$('#exportBtn').onclick=()=>showSaveAsDialog();$('#openBtn').onclick=openWithPicker;$('#fileInput').onchange=e=>{if(e.target.files?.[0])openFile(e.target.files[0]);e.target.value='';};render();
</script>
</body></html>
