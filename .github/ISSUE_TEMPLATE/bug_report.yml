name: Bug report
description: Report a reproducible MyOffice One problem
body:
  - type: input
    id: version
    attributes:
      label: App and Windows version
      placeholder: MyOffice One 0.4.0, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the file format and exact actions. Remove private information from samples.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
